name: Vinted Hunter (On-Demand Cloud Scan)

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Search term or 'auto' for 4 MOTU queries"
        required: false
        default: "auto"
      chat_id:
        description: "Optional specific Telegram Chat ID for alerts"
        required: false
        default: ""

jobs:
  hunt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Vinted Cloud Hunter
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_QUERY: ${{ github.event.inputs.query }}
          INPUT_CHAT_ID: ${{ github.event.inputs.chat_id }}
          PYTHONPATH: .
        run: |
          SAFE_QUERY=$(printf '%s' "${INPUT_QUERY:-auto}" | tr -cd 'a-zA-Z0-9 ._-')
          [ -z "$SAFE_QUERY" ] && SAFE_QUERY="auto"
          if [ -n "$INPUT_CHAT_ID" ]; then
            SAFE_CHAT=$(printf '%s' "$INPUT_CHAT_ID" | tr -cd '0-9-')
            [ -n "$SAFE_CHAT" ] && python scripts/hunt_vinted.py --query "$SAFE_QUERY" --chat-id "$SAFE_CHAT" && exit 0
          fi
          python scripts/hunt_vinted.py --query "$SAFE_QUERY"
