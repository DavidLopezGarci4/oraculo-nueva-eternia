name: Oracle Master Workflow (Daily Scan)

on:
  schedule:
    - cron: '0 2 * * *'        # 2:00 AM UTC
    - cron: '30 14 * * *'      # 2:30 PM UTC
  workflow_dispatch:           # Manual trigger
    inputs:
      shops:
        description: 'Specific shops to scrape (space separated, e.g. actiontoys fantasia lamansiondelterror)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4.2.2
      
      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          
      - name: Nexo Maestro - Master Catalog & Cloud Image Sync
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: .
        run: |
          python -c "import asyncio; from src.application.services.nexus_service import NexusService; asyncio.run(NexusService.sync_catalog())"

      - name: Excel Reverse Sync (Cloud -> Local Heritage)
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PYTHONPATH: .
        run: |
          python scripts/sync_excel_from_db.py

      - name: Auto-Commit Excel Updates
        run: |
          git config --global user.name "Oracle Guardian Bot"
          git config --global user.email "guardian@nueva-eternia.com"
          # Safe reset to avoid committing accidental artifacts
          git reset
          # Force add only the Master Excel
          git add -f data/MOTU/lista_MOTU.xlsx
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes in Excel to commit."
          else
            git commit -m "chore: auto-sync collection status to Excel [skip ci]"
            # Handle potential concurrency conflicts with rebase
            git pull --rebase origin main
            git push
          fi
      - name: Setup Cloudflare WARP Proxy (Zero-Cost Consumer Egress IP)
        continue-on-error: true
        run: |
          set +e
          sudo apt-get update && sudo apt-get install -y xvfb
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          if ! sudo apt-get update; then
            echo "⚠️ Cloudflare APT repo sin Release para $(lsb_release -cs), aplicando fallback a noble..."
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update
          fi
          sudo apt-get install -y cloudflare-warp
          sudo systemctl start warp-svc || true
          sleep 2
          warp-cli --accept-tos registration new || warp-cli --accept-tos register || true
          warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy || true
          warp-cli --accept-tos proxy port 40000 || warp-cli --accept-tos set-proxy-port 40000 || true
          warp-cli --accept-tos connect || true
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 4 --proxy socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -qE "warp=(on|plus)"; then
              echo "✅ Cloudflare WARP proxy activo en socks5://127.0.0.1:40000"
              echo "WARP_PROXY=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"
              break
            fi
            sleep 2
          done
          exit 0

      - name: Run Scrapers (Market Incursion)
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TOKEN2: ${{ secrets.APIFY_TOKEN2 }}
          APIFY_TOKEN3: ${{ secrets.APIFY_TOKEN3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a --server-args="-screen 0 1366x768x24" python src/application/jobs/daily_scan.py --shops "${{ github.event.inputs.shops }}" --random-delay 0 --no-nexus
          else
            python src/application/jobs/daily_scan.py --shops "${{ github.event.inputs.shops }}" --random-delay 0 --no-nexus
          fi

      - name: SSL Certificate Guardian (Auto-Renew if <= 14 days)
        if: always()
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST || '79.72.50.244' }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER || 'opc' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
        run: |
          python scripts/check_and_renew_ssl_gh_actions.py

      - name: Send Telegram Failure Alert
        if: failure()
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            TEXT=$'🚨 <b>[GitHub Actions: FALLO EN WORKFLOW]</b>\n\n❌ El flujo maestro del <b>Daily Scan</b> ha sufrido un error en GitHub Actions antes de completarse.\n\n⚠️ Por favor, revisa la pestaña de Actions en el repositorio para ver los logs detallados.'
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              --data-urlencode "parse_mode=HTML" > /dev/null
          fi

      - name: Send Telegram Reminder
        if: success()
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            TEXT=$'🤖 <b>Oráculo de Nueva Eternia</b>\n\nEl proceso de importación y scrapers de GitHub Actions ha finalizado.\n\n⚠️ <b>Recordatorio:</b> No olvides lanzar el scraper de <b>Wallapop</b> desde la app para capturar las últimas ofertas.'
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              --data-urlencode "parse_mode=HTML" > /dev/null
          else
            echo "Telegram credentials not found. Skipping notification."
          fi

